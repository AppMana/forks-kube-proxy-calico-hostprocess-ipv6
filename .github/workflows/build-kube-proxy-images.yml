name: Build Kube-Proxy images

on:
  push:
    branches: [master]
    paths:
      - 'hostprocess/calico/kube-proxy/**'
      - 'patches/**'
      - '.github/workflows/build-kube-proxy-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  K8S_VERSION: v1.34.6

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: hostprocess/calico/kube-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: build patched kube-proxy.exe + fetch hns.psm1
        run: |
          git clone --depth 1 --branch $env:K8S_VERSION https://github.com/kubernetes/kubernetes.git $env:RUNNER_TEMP\kubernetes
          Push-Location $env:RUNNER_TEMP\kubernetes
          git apply "$env:GITHUB_WORKSPACE\patches\kubernetes-v1.34.6-winkernel-loadbalancer-state.patch"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o "$env:GITHUB_WORKSPACE\hostprocess\calico\kube-proxy\kube-proxy.exe" .\cmd\kube-proxy
          Pop-Location
          Invoke-WebRequest -OutFile hns.psm1 https://raw.githubusercontent.com/microsoft/SDN/master/Kubernetes/windows/hns.psm1

      - name: docker login ghcr
        run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: docker build & push
        run: |
          docker build -t ghcr.io/appmana/kube-proxy:$env:K8S_VERSION-calico-hostprocess .
          docker push ghcr.io/appmana/kube-proxy:$env:K8S_VERSION-calico-hostprocess
