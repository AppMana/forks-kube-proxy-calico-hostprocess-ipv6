name: Build Kube-Proxy images

on:
  push:
    branches: [master, "cloud-provisioning/**", "appmana/kube-proxy-v1.36.4"]
    # A release tag names exactly one image_tag below; only that version is
    # built and published, without a branch suffix, so a release never
    # rewrites the other versions' tags.
    tags: ["v*-appmana.post.*-calico-hostprocess"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/appmana
  IMAGE_NAME: kube-proxy

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.tag.outputs.suffix }}
      matrix: ${{ steps.tag.outputs.matrix }}
    steps:
      - id: tag
        shell: bash
        run: |
          # post.15/post.11 and later: DSR disabled by default (opt in with
          # KUBEPROXY_ENABLE_DSR=true), health-check VIP defaults to
          # KUBERNETES_SERVICE_HOST, in-script stale-ELB watchdog replaces the
          # DaemonSet livenessProbe; required because k0s 1.36 renders its own
          # env-less kube-proxy-windows DaemonSet (override the image via k0s
          # spec.images.windows.kubeproxy). source_sha is a commit of
          # AppMana/forks-kubernetes-kube-proxy-windows-ipv6.
          matrix='[
            {"k8s_version": "v1.34.6", "source_sha": "fbb36641b584f07432649964054986cde373db5f", "go_version": "1.24.x", "image_tag": "v1.34.6-appmana.post.17-calico-hostprocess"},
            {"k8s_version": "v1.35.5", "source_sha": "9b00f285777b78a8684700b822b5072f5c5de0a2", "go_version": "1.25.x", "image_tag": "v1.35.5-appmana.post.13-calico-hostprocess"},
            {"k8s_version": "v1.36.2", "source_sha": "6d89988d2cc2ddcdd78138fe827b68232c5df8ab", "go_version": "1.26.x", "image_tag": "v1.36.2-appmana.post.13-calico-hostprocess"},
            {"k8s_version": "v1.36.4", "source_sha": "5e4cbae1107d8d1d492df0b6351a369e0402027c", "go_version": "1.26.x", "image_tag": "v1.36.4-appmana.post.14-calico-hostprocess"}
          ]'
          suffix=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            matrix="$(jq -c --arg tag "$GITHUB_REF_NAME" '[.[] | select(.image_tag == $tag)]' <<< "$matrix")"
            if [[ "$(jq length <<< "$matrix")" != 1 ]]; then
              echo "tag $GITHUB_REF_NAME names no image_tag in the matrix" >&2
              exit 1
            fi
          else
            branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g' | cut -c1-40)"
            suffix="-${branch}-${GITHUB_SHA:0:12}"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c . <<< "$matrix")" >> "$GITHUB_OUTPUT"

  script-tests:
    # Mocked behavior tests for the shipped PowerShell (hack/appmana/tests/):
    # a regression here fails the build instead of the fleet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 hack/appmana/tests/test_release_metadata.py
      - run: pwsh -NoProfile -File hack/appmana/tests/wait-hns.tests.ps1

  test-windows-2025:
    needs: [script-tests, metadata]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}
      - uses: actions/checkout@v4
        with:
          repository: AppMana/forks-kubernetes-kube-proxy-windows-ipv6
          ref: ${{ matrix.source_sha }}
          ssh-key: ${{ secrets.KUBERNETES_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
      - name: Test pinned fork source on Windows Server 2025
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location source
          if ((git rev-parse HEAD) -ne "${{ matrix.source_sha }}") { throw "source pin mismatch" }
          go test "-coverprofile=winkernel.cover" ./pkg/proxy/winkernel/...
          if ($LASTEXITCODE -ne 0) { throw "native tests failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winkernel-${{ matrix.k8s_version }}-windows-2025
          path: source/winkernel.cover

  build-windows:
    needs: [script-tests, metadata]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    defaults:
      run:
        working-directory: hostprocess/calico/kube-proxy
    outputs:
      registry: ${{ env.REGISTRY }}
      image-name: ${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - uses: actions/checkout@v4
        with:
          repository: AppMana/forks-kubernetes-kube-proxy-windows-ipv6
          ref: ${{ matrix.source_sha }}
          ssh-key: ${{ secrets.KUBERNETES_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: kubernetes

      - name: Build patched kube-proxy.exe and fetch hns.psm1
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-LastExitCode {
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed with exit code $LASTEXITCODE"
            }
          }

          Push-Location $env:GITHUB_WORKSPACE\kubernetes
          git config core.autocrlf false
          if ((git rev-parse HEAD) -ne "${{ matrix.source_sha }}") {
            throw "Kubernetes source branch differs from pinned commit"
          }
          if (-not (Select-String -Path .\pkg\proxy\winkernel\proxier.go -Pattern "reconciling current HNS state" -SimpleMatch -Quiet)) {
            throw "patched proxier.go does not contain stale-HNS reconciliation marker"
          }
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go test ./pkg/proxy/winkernel/...
          Assert-LastExitCode
          $version = "${{ matrix.k8s_version }}+appmana.${{ matrix.source_sha }}"
          $versionPackage = "k8s.io/component-base/version"
          $buildDate = ([DateTimeOffset]::Parse((git show -s --format=%cI HEAD))).UtcDateTime.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-X $versionPackage.gitVersion=$version -X $versionPackage.gitCommit=${{ matrix.source_sha }} -X $versionPackage.gitTreeState=clean -X $versionPackage.buildDate=$buildDate"
          $binary = "$env:GITHUB_WORKSPACE\hostprocess\calico\kube-proxy\kube-proxy.exe"
          go build -trimpath -buildvcs=false -ldflags $ldflags -o $binary .\cmd\kube-proxy
          Assert-LastExitCode
          $reported = & $binary --version
          Assert-LastExitCode
          if ($reported -notmatch [regex]::Escape($version)) { throw "built binary version mismatch: $reported" }
          Pop-Location
          Invoke-WebRequest -OutFile hns.psm1 https://raw.githubusercontent.com/microsoft/SDN/710cad6fc9025c86e04ef5daa6eb53f577802448/Kubernetes/windows/hns.psm1

      - name: Docker login ghcr
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Windows image
        run: |
          $windowsImage = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}${{ needs.metadata.outputs.suffix }}-windows-ltsc2022"
          docker build `
            --build-arg WINDOWS_VERSION=ltsc2022 `
            --label "org.opencontainers.image.revision=${{ matrix.source_sha }}" `
            --label "org.opencontainers.image.source=https://github.com/AppMana/forks-kubernetes-kube-proxy-windows-ipv6" `
            --label "org.opencontainers.image.version=${{ matrix.k8s_version }}" `
            -t $windowsImage .

      - name: Push Windows image
        if: github.event_name == 'push'
        run: |
          $windowsImage = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}${{ needs.metadata.outputs.suffix }}-windows-ltsc2022"
          docker push $windowsImage

  publish-manifest:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build-windows, test-windows-2025, metadata]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Docker login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-platform manifest
        run: |
          set -euo pipefail
          manifest_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}${{ needs.metadata.outputs.suffix }}"
          windows_image="${manifest_image}-windows-ltsc2022"
          upstream_image="registry.k8s.io/kube-proxy:${{ matrix.k8s_version }}"
          # Linux entries are upstream kube-proxy, unchanged: the fork patches
          # only winkernel.
          linux_digest() {
            docker buildx imagetools inspect --raw "$upstream_image" |
              jq -er --arg arch "$1" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("expected one linux/\($arch) entry") end'
          }
          amd64="$(linux_digest amd64)"
          arm64="$(linux_digest arm64)"
          windows="$(docker buildx imagetools inspect "$windows_image" --format '{{json .Manifest}}' | jq -er 'select(.mediaType | test("manifest\\.v2|image\\.manifest")) | .digest')"
          # imagetools copies the upstream manifests into this repository but
          # records no os.version for the Windows entry. Containerd on Server
          # 2022 matches os.version against the host build, so rewrite the
          # list from the copied digests with the built image's os.version.
          docker buildx imagetools create --tag "$manifest_image" \
            "${upstream_image}@${amd64}" "${upstream_image}@${arm64}" "$windows_image"
          repo="${manifest_image%:*}"
          win_config="$(docker buildx imagetools inspect "$windows_image" --format '{{json .Image}}')"
          win_os_version="$(jq -er 'select(.os == "windows" and .architecture == "amd64") | ."os.version" | select(type == "string" and startswith("10.0.20348."))' <<< "$win_config")"
          docker manifest create "$manifest_image" "${repo}@${amd64}" "${repo}@${arm64}" "${repo}@${windows}"
          docker manifest annotate --os windows --arch amd64 --os-version "$win_os_version" "$manifest_image" "${repo}@${windows}"
          docker manifest push --purge "$manifest_image"

          docker buildx imagetools inspect "$manifest_image"
          docker buildx imagetools inspect --raw "$manifest_image" | jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64", "windows/amd64"]' >/dev/null
