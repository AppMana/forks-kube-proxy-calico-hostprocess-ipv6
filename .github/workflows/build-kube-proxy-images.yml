name: Build Kube-Proxy images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/appmana
  IMAGE_NAME: kube-proxy

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # post.15/post.11: DSR disabled by default (opt in with
          # KUBEPROXY_ENABLE_DSR=true), health-check VIP defaults to
          # KUBERNETES_SERVICE_HOST, in-script stale-ELB watchdog replaces the
          # DaemonSet livenessProbe — required because k0s 1.36 renders its own
          # env-less kube-proxy-windows DaemonSet (override the image via k0s
          # spec.images.windows.kubeproxy).
          - k8s_version: v1.34.6
            go_version: 1.24.x
            patch_file: kubernetes-v1.34-winkernel-loadbalancer-state.patch
            image_tag: v1.34.6-appmana.post.16-calico-hostprocess
          - k8s_version: v1.35.5
            go_version: 1.25.x
            patch_file: kubernetes-v1.35-winkernel-loadbalancer-state.patch
            image_tag: v1.35.5-appmana.post.12-calico-hostprocess
          - k8s_version: v1.36.2
            go_version: 1.25.x
            patch_file: kubernetes-v1.36-winkernel-loadbalancer-state.patch
            image_tag: v1.36.2-appmana.post.12-calico-hostprocess
    defaults:
      run:
        working-directory: hostprocess/calico/kube-proxy
    outputs:
      registry: ${{ env.REGISTRY }}
      image-name: ${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Build patched kube-proxy.exe and fetch hns.psm1
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-LastExitCode {
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed with exit code $LASTEXITCODE"
            }
          }

          git -c core.autocrlf=false clone --depth 1 --branch ${{ matrix.k8s_version }} https://github.com/kubernetes/kubernetes.git $env:RUNNER_TEMP\kubernetes
          Assert-LastExitCode
          Push-Location $env:RUNNER_TEMP\kubernetes
          git config core.autocrlf false
          $patchPath = "$env:GITHUB_WORKSPACE\patches\${{ matrix.patch_file }}"
          $normalizedPatchPath = "$env:RUNNER_TEMP\${{ matrix.patch_file }}"
          $patchText = [System.IO.File]::ReadAllText($patchPath).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText($normalizedPatchPath, $patchText, [System.Text.UTF8Encoding]::new($false))
          git apply --whitespace=nowarn $normalizedPatchPath
          Assert-LastExitCode
          if (-not (Select-String -Path .\pkg\proxy\winkernel\proxier.go -Pattern "reconciling current HNS state" -SimpleMatch -Quiet)) {
            throw "patched proxier.go does not contain stale-HNS reconciliation marker"
          }
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go test ./pkg/proxy/winkernel/...
          Assert-LastExitCode
          go build -o "$env:GITHUB_WORKSPACE\hostprocess\calico\kube-proxy\kube-proxy.exe" .\cmd\kube-proxy
          Assert-LastExitCode
          Pop-Location
          Invoke-WebRequest -OutFile hns.psm1 https://raw.githubusercontent.com/microsoft/SDN/710cad6fc9025c86e04ef5daa6eb53f577802448/Kubernetes/windows/hns.psm1

      - name: Docker login ghcr
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Windows image
        run: |
          $windowsImage = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}-windows-ltsc2022"
          docker build `
            --build-arg WINDOWS_VERSION=ltsc2022 `
            -t $windowsImage .

      - name: Push Windows image
        if: github.event_name == 'push'
        run: |
          $windowsImage = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}-windows-ltsc2022"
          docker push $windowsImage

  publish-manifest:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build-windows]
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the build-windows matrix image_tag values above —
        # this job assembles the plain multi-platform manifest tags from the
        # -windows-ltsc2022 arch tags the build jobs push.
        include:
          - k8s_version: v1.34.6
            image_tag: v1.34.6-appmana.post.16-calico-hostprocess
          - k8s_version: v1.35.5
            image_tag: v1.35.5-appmana.post.12-calico-hostprocess
          - k8s_version: v1.36.2
            image_tag: v1.36.2-appmana.post.12-calico-hostprocess
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Docker login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-platform manifest
        run: |
          set -euo pipefail
          manifest_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}"
          windows_image="${manifest_image}-windows-ltsc2022"
          upstream_image="registry.k8s.io/kube-proxy:${{ matrix.k8s_version }}"
          linux_digest="$(
            docker buildx imagetools inspect --raw "$upstream_image" |
              jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' |
              head -n 1
          )"
          if [ -z "$linux_digest" ] || [ "$linux_digest" = "null" ]; then
            echo "Could not find linux/amd64 digest for $upstream_image" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "$manifest_image" \
            "${upstream_image}@${linux_digest}" \
            "$windows_image"

          docker buildx imagetools inspect "$manifest_image"
